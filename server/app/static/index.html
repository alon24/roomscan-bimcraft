<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomScan</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --mute:#6b7380; --line:#d8dce2; --acc:#2563eb; --err:#c62828; --ok:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --fg:#e6e9ee; --mute:#8b94a1; --line:#2a2f37; --acc:#6ea0ff; --err:#ef7b7b; --ok:#6fcf7a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  @media (max-width:700px) { body { grid-template-columns:1fr; } }
  aside { border-right:1px solid var(--line); padding:16px; }
  main { padding:16px; min-width:0; }
  h1 { font-size:18px; margin:0 0 12px; }
  ul { list-style:none; padding:0; margin:0; }
  li button { all:unset; display:block; width:100%; padding:8px; border-radius:6px; cursor:pointer; }
  li button:hover, li button.sel { background:color-mix(in srgb, var(--acc) 14%, transparent); }
  li small { color:var(--mute); display:block; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .btn { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:none; color:var(--fg); text-decoration:none; cursor:pointer; font:inherit; }
  .btn:hover { border-color:var(--acc); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:1000px) { .grid { grid-template-columns:1fr; } }
  #view { width:100%; height:380px; border:1px solid var(--line); border-radius:6px; }
  img { max-width:100%; border:1px solid var(--line); border-radius:6px; background:#fff; }
  pre { background:color-mix(in srgb, var(--fg) 6%, transparent); padding:10px; border-radius:6px; overflow:auto; max-height:240px; font-size:12px; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:6px; margin-top:8px; }
  .thumbs img { width:100%; aspect-ratio:4/3; object-fit:cover; cursor:pointer; }
  dialog { border:0; padding:0; background:none; max-width:96vw; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog img { max-width:96vw; max-height:92vh; display:block; }
  .btn.on { border-color:var(--acc); background:color-mix(in srgb, var(--acc) 16%, transparent); }
  .grp { display:flex; align-items:center; gap:6px; margin:14px 0 4px; font-weight:600; }
  .grp small { color:var(--mute); font-weight:400; }
  .grp .sp { flex:1; }
  .ico { all:unset; cursor:pointer; padding:2px 6px; border-radius:4px; color:var(--mute); font-size:13px; }
  .ico:hover { background:color-mix(in srgb, var(--acc) 14%, transparent); color:var(--fg); }
  #search { width:100%; margin:10px 0 0; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:none; color:var(--fg); font:inherit; }
  form label { display:block; margin:10px 0; font-size:13px; color:var(--mute); }
  form input { display:block; width:100%; margin-top:4px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  #form { border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); padding:16px; min-width:min(360px,90vw); }
  #form::backdrop { background:rgba(0,0,0,.5); }
  .danger { border-color:var(--err); color:var(--err); }
  .ok { color:var(--ok); } .error { color:var(--err); }
  .mute { color:var(--mute); }
  body.embed { grid-template-columns:1fr; }
  body.embed aside { border-right:0; border-bottom:1px solid var(--line); max-height:28vh; overflow:auto; padding:8px 12px; }
  body.embed h1 { display:none; }
  .hint { font-size:12px; color:var(--mute); margin:4px 0 0; }
</style>
</head>
<body>
<aside>
  <h1>RoomScan</h1>
  <div class="row"><button class="btn" id="newHome">+ Home</button><button class="btn" id="importBtn">Import zip</button>
    <input type="file" id="importFile" accept=".zip,application/zip" hidden></div>
  <input id="search" placeholder="Search rooms and objects" type="search">
  <div id="list"></div>
  <datalist id="projList"></datalist>
  <p class="mute" id="empty" hidden>No scans yet. Upload from the app.</p>
</aside>
<main>
  <p class="mute" id="hint">Select a scan.</p>
  <div id="detail" hidden>
    <h1 id="title"></h1>
    <div>Status: <b id="status"></b></div>
    <div class="row" id="actions"></div>
    <div class="row" id="modes" hidden></div>
    <div class="grid">
      <div><div id="view"></div><p class="hint">Drag: rotate · right-drag or two fingers: pan · scroll or pinch: zoom · double-click: reset</p></div>
      <div><img id="plan" alt="Plan"></div>
    </div>
    <div id="photosBox" hidden><h3>Photos</h3><div id="photos" class="thumbs"></div></div>
    <h3>Log</h3>
    <pre id="log"></pre>
  </div>
</main>
<dialog id="dlg"><img id="big" alt=""></dialog>
<dialog id="form"><form method="dialog">
  <h3 id="formTitle" style="margin:0 0 8px"></h3><div id="formFields"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" type="button" onclick="document.getElementById('form').close('cancel')">Cancel</button><button class="btn" id="formOk" type="submit" value="ok"></button></div>
</form></dialog>
<script type="module">
import * as THREE from "./three.module.min.js";

const $ = id => document.getElementById(id);
let current = null, renderer = null, raf = 0;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : undefined });
  if (!r.ok) { alert(`${path}: ${r.status} ${await r.text()}`); throw new Error(r.status); }
  return r.json();
}

/** Small modal form. Resolves to {key: value} on OK, null on cancel. */
function ask(title, fields, okLabel = "Save", danger = false) {
  return new Promise(resolve => {
    const dlg = $("form"), box = $("formFields");
    $("formTitle").textContent = title; box.replaceChildren();
    const inputs = fields.map(f => {
      const l = document.createElement("label"), i = document.createElement("input");
      l.textContent = f.label; i.value = f.value ?? ""; if (f.list) i.setAttribute("list", "projList");
      l.append(i); box.append(l); return [f.key, i];
    });
    $("formOk").textContent = okLabel; $("formOk").className = "btn" + (danger ? " danger" : "");
    dlg.onclose = () => resolve(dlg.returnValue === "ok" ? Object.fromEntries(inputs.map(([k, i]) => [k, i.value.trim()])) : null);
    dlg.showModal();
    inputs[0]?.[1].focus();
  });
}

function icoBtn(label, title, fn) {
  const b = document.createElement("button");
  b.className = "ico"; b.textContent = label; b.title = title; b.onclick = fn;
  return b;
}

async function loadList() {
  const [scans, projects] = await Promise.all([api("/api/scans"), api("/api/projects")]);
  $("projList").replaceChildren(...projects.map(p => Object.assign(document.createElement("option"), { value: p.name })));
  const q = $("search").value.trim().toLowerCase();
  const visible = scans.filter(s => !q || s.name.toLowerCase().includes(q));
  $("empty").hidden = scans.length > 0 || projects.length > 0;
  const groups = [...projects.map(p => ({ project: p, items: visible.filter(s => s.project === p.name) })),
                  { project: null, items: visible.filter(s => !s.project) }];
  const out = [];
  for (const g of groups) {
    if (!g.project && !g.items.length) continue;
    if (q && !g.items.length) continue;
    const head = document.createElement("div"); head.className = "grp";
    const title = document.createElement("span"); title.textContent = g.project ? g.project.name : "No home";
    const count = document.createElement("small"); count.textContent = g.items.length;
    const sp = Object.assign(document.createElement("span"), { className: "sp" });
    head.append(title, count, sp);
    if (g.project) {
      const name = g.project.name;
      head.append(
        icoBtn("✎", "Rename home", async () => {
          const v = await ask("Rename home", [{ key: "name", label: "Name", value: name }]);
          if (v?.name && v.name !== name) { await api(`/api/projects/${encodeURIComponent(name)}`, { method: "PATCH", body: JSON.stringify(v) }); loadList(); }
        }),
        Object.assign(icoBtn("⬇", "Download this home as a zip", () => {}), { onclick: () => location.href = `/api/export.zip?project=${encodeURIComponent(name)}` }),
        icoBtn("✕", "Delete home", async () => {
          const v = await ask(`Delete home “${name}”?`, [{ key: "also", label: "Type DELETE to also delete its rooms, or leave empty to keep them" }], "Delete home", true);
          if (!v) return;
          await api(`/api/projects/${encodeURIComponent(name)}?delete_scans=${v.also === "DELETE"}`, { method: "DELETE" });
          loadList();
        }));
    }
    out.push(head);
    const ul = document.createElement("ul");
    for (const s of g.items) {
      const li = document.createElement("li"), b = document.createElement("button");
      b.className = s.id === current ? "sel" : "";
      b.textContent = (s.kind === "object" ? "◆ " : "▢ ") + s.name;
      const small = document.createElement("small");
      small.textContent = new Date(s.created_at * 1000).toLocaleString() + " · " + (s.status || "?");
      b.append(small); b.onclick = () => show(s.id);
      li.append(b); ul.append(li);
    }
    out.push(ul);
  }
  $("list").replaceChildren(...out);
}
$("search").oninput = () => loadList();
$("newHome").onclick = async () => {
  const v = await ask("New home", [{ key: "name", label: "Name" }], "Create");
  if (v?.name) { await api("/api/projects", { method: "POST", body: JSON.stringify(v) }); loadList(); }
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  const r = await api("/api/import", { method: "POST", body: fd });
  await loadList();
  if (r.imported[0]) show(r.imported[0].id);
};

function clearDetail() { current = null; $("detail").hidden = true; $("hint").hidden = false; }

async function show(id) {
  current = id;
  const meta = await (await fetch(`/api/scans/${id}`)).json();
  $("hint").hidden = true; $("detail").hidden = false;
  $("modes").hidden = true; ctx = null;
  $("title").textContent = meta.name;
  $("status").textContent = meta.status; $("status").className = meta.status;
  $("log").textContent = meta.log || "";
  const isObj = meta.kind === "object";
  $("plan").hidden = isObj;
  $("plan").src = !isObj && meta.status === "ok" ? `/api/scans/${id}/plan.png?t=${Date.now()}` : "";
  const actions = $("actions");
  actions.replaceChildren();
  for (const f of isObj ? ["model.stl", "model.3mf"] : ["room.bimcraft", "room.ifc", "plan.png", "script.txt", "scan.json"]) {
    const a = document.createElement("a");
    a.className = "btn"; a.textContent = f; a.href = `/api/scans/${id}/${f}`; a.download = f;
    actions.append(a);
  }
  const re = document.createElement("button");
  re.className = "btn"; re.textContent = "Re-convert";
  re.onclick = async () => { re.disabled = true; await fetch(`/api/scans/${id}/convert`, { method: "POST" }); await show(id); loadList(); };
  if (isObj) {
    const sc = document.createElement("input");
    sc.type = "number"; sc.step = "any"; sc.min = "0.001"; sc.value = meta.scale ?? 1; sc.title = "Scale factor";
    sc.style.width = "5em";
    re.onclick = async () => { re.disabled = true; await fetch(`/api/scans/${id}/convert?scale=${sc.value}`, { method: "POST" }); await show(id); loadList(); };
    actions.append(sc);
  }
  actions.append(re);
  const mk = (label, fn, cls = "") => { const x = document.createElement("button"); x.className = "btn " + cls; x.textContent = label; x.onclick = fn; actions.append(x); };
  mk("Rename", async () => {
    const v = await ask("Rename", [{ key: "name", label: "Name", value: meta.name }]);
    if (v?.name) { await api(`/api/scans/${id}`, { method: "PATCH", body: JSON.stringify(v) }); show(id); }
  });
  mk("Move to home…", async () => {
    const v = await ask("Move to home", [{ key: "project", label: "Home (empty = none)", value: meta.project ?? "", list: true }], "Move");
    if (v) { await api(`/api/scans/${id}`, { method: "PATCH", body: JSON.stringify(v) }); show(id); }
  });
  mk("Save as zip", () => { location.href = `/api/scans/${id}/bundle.zip`; });
  mk("Delete", async () => {
    if (await ask(`Delete “${meta.name}”? This cannot be undone.`, [], "Delete", true)) {
      await api(`/api/scans/${id}`, { method: "DELETE" }); clearDetail(); loadList();
    }
  }, "danger");
  loadList();
  if (isObj) {
    await loadPhotos(meta);
    if (meta.status === "ok") {
      const r = await (await fetch(`/api/scans/${id}/report.json`)).json();
      $("log").textContent = `Size: ${r.size_mm.join(" × ")} mm\nWatertight: ${r.watertight ? "yes" : "NO – slicer may need repair"}\nVolume: ${r.volume_mm3 ?? "n/a"} mm³\nFaces: ${r.faces}\n\n` + (meta.log || "");
      try { drawMesh(await (await fetch(`/api/scans/${id}/preview.json`)).json()); }
      catch (e) { $("log").textContent += "\n3D preview failed: " + e; }
    }
    return;
  }
  const poses = await loadPhotos(meta);
  try {
    const scan = await (await fetch(`/api/scans/${id}/scan.json`)).json();
    let index = null;
    if (poses.length) try { index = await (await fetch(`/api/scans/${id}/photo_index.json`)).json(); } catch {}
    ctx = { id, scan, poses, index, mode: index && Object.keys(index).length ? "both" : "lidar" };
    setupModes();
    show3d(roomGroup(ctx), false);
  }
  catch (e) { $("log").textContent += "\n3D preview failed: " + e; }
}

function openPhoto(id, name) {
  $("big").src = `/api/scans/${id}/photos/${name}`;
  $("dlg").showModal();
}
$("dlg").onclick = () => $("dlg").close();

async function loadPhotos(meta) {
  $("photosBox").hidden = !(meta.photo_count > 0);
  $("photos").replaceChildren();
  if (!(meta.photo_count > 0)) return [];
  let poses = [];
  try { const m = await (await fetch(`/api/scans/${meta.id}/photos.json`)).json(); poses = m.photos ?? m; } catch {}
  const names = poses.length ? poses.map(p => p.file) : Array.from({ length: meta.photo_count }, (_, i) => null);
  if (poses.length) for (const f of names) addThumb(meta.id, f);
  else {  // no manifest (objects): list by index; server names are o001.jpg, o002.jpg, ...
    for (let i = 1; i <= meta.photo_count; i++) addThumb(meta.id, `o${String(i).padStart(3, "0")}.jpg`);
  }
  return poses;
}

function addThumb(id, file) {
  const img = document.createElement("img");
  img.loading = "lazy"; img.src = `/api/scans/${id}/photos/${file}`; img.onclick = () => openPhoto(id, file);
  $("photos").append(img);
}

function photoMarker(id, p) {  // a small arrow at each camera pose, pointing where the photo looks (ARKit camera looks down -Z)
  const g = new THREE.ConeGeometry(0.08, 0.25, 4);
  g.translate(0, 0.125, 0); g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xe8453c }));
  m.applyMatrix4(new THREE.Matrix4().fromArray(p.transform.flat()));
  m.userData.photo = [id, p.file];
  return m;
}

// ---- room preview modes: LiDAR boxes, photos mapped onto the surfaces, or both
let ctx = null;  // {id, scan, poses, index, mode}
const texLoader = new THREE.TextureLoader();
const MODES = [["lidar", "LiDAR"], ["images", "Photos"], ["both", "LiDAR + photos"]];

function setupModes() {
  const box = $("modes");
  const usable = ctx.index && Object.keys(ctx.index).length > 0;
  box.hidden = !usable;
  box.replaceChildren(...MODES.map(([k, label]) => {
    const b = document.createElement("button");
    b.className = "btn" + (k === ctx.mode ? " on" : ""); b.textContent = label;
    b.onclick = () => { ctx.mode = k; setupModes(); show3d(roomGroup(ctx), true); };
    return b;
  }));
}

function roomGroup(c) {
  const g = new THREE.Group();
  for (const [key, color, op] of [["walls", 0xb8bec8, 0.75], ["doors", 0xb5733a, 1], ["windows", 0x4aa3df, 0.7]]) {
    for (const s of c.scan[key] || []) {
      if (c.mode !== "images") g.add(surfaceMesh(s, color, op));
      if (c.mode === "lidar") continue;
      const best = c.index?.[s.identifier]?.photos?.[0];
      const ph = best && c.poses.find(p => p.file === best.photo);
      const m = ph && texturedSurface(c.id, s, ph, c.mode === "both");
      if (m) g.add(m);
    }
  }
  for (const p of c.poses) g.add(photoMarker(c.id, p));
  return g;
}

/** A surface grid whose UVs come from projecting each vertex through the photo's camera (perspective-correct).
 *  Cells the photo does not fully see are left out rather than smeared. */
function texturedSurface(id, s, ph, offset) {
  const [w, h, d] = s.dimensions, N = 16;
  const M = new THREE.Matrix4().fromArray(s.transform.flat());
  const cam = new THREE.Matrix4().fromArray(ph.transform.flat()).invert();
  const K = ph.intrinsics, fx = K[0][0], fy = K[1][1], cx = K[2][0], cy = K[2][1];
  let z = 0;
  if (offset) {  // sit just in front of the LiDAR box, on the side the photo was taken from
    const centre = new THREE.Vector3().setFromMatrixPosition(M);
    const normal = new THREE.Vector3().setFromMatrixColumn(M, 2).normalize();
    const camPos = new THREE.Vector3().setFromMatrixPosition(new THREE.Matrix4().fromArray(ph.transform.flat()));
    z = (camPos.clone().sub(centre).dot(normal) >= 0 ? 1 : -1) * (Math.max(d, 0.05) / 2 + 0.01);
  }
  const pos = [], uv = [], ok = [];
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const v = new THREE.Vector3((i / N - 0.5) * w, (j / N - 0.5) * h, z).applyMatrix4(M);
    const c = v.clone().applyMatrix4(cam), depth = -c.z;  // ARKit camera looks down -Z
    const u = fx * c.x / depth + cx, vv = cy - fy * c.y / depth;
    pos.push(v.x, v.y, v.z); uv.push(u / ph.width, 1 - vv / ph.height);
    ok.push(depth > 0.05 && u >= 0 && u <= ph.width && vv >= 0 && vv <= ph.height);
  }
  const idx = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c2 = a + N + 1, d2 = c2 + 1;
    if (ok[a] && ok[b] && ok[c2] && ok[d2]) idx.push(a, c2, b, b, c2, d2);
  }
  if (!idx.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  const tex = texLoader.load(`/api/scans/${id}/photos/${ph.file}`);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
}

function surfaceMesh(s, color, opacity) {
  const [w, h, d] = s.dimensions;
  const t = s.transform.length === 16 ? s.transform : s.transform.flat();
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, Math.max(d, 0.05)),
    new THREE.MeshLambertMaterial({ color, transparent: opacity < 1, opacity }));
  m.applyMatrix4(new THREE.Matrix4().fromArray(t));  // column-major, as RoomPlan encodes it
  return m;
}

function drawMesh(m) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(m.vertices, 3));
  g.setIndex(m.faces);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xc9a46c, roughness: 0.7, side: THREE.DoubleSide }));
  mesh.rotation.x = -Math.PI / 2;  // model is Z-up (printer), three.js is Y-up
  show3d(mesh);
}

function draw(scan, keepView = false, markers = []) {
  const group = new THREE.Group();
  for (const m of markers) group.add(m);
  for (const w of scan.walls || []) group.add(surfaceMesh(w, 0xb8bec8, 0.75));
  for (const d of scan.doors || []) group.add(surfaceMesh(d, 0xb5733a, 1));
  for (const w of scan.windows || []) group.add(surfaceMesh(w, 0x4aa3df, 0.7));
  show3d(group, keepView);
}

let V = null;  // persistent 3D view: {scene, cam, group, place, fit}

function show3d(group, keepView = false) {
  if (keepView && V && V.renderer.domElement.isConnected) {  // live frame: swap the model, keep the camera
    V.scene.remove(V.group); V.scene.add(group); V.group = group;
    if (V.fit) { V.fit(); V.fit = null; }
    return;
  }
  cancelAnimationFrame(raf);
  const el = $("view");
  if (renderer) { renderer.dispose(); el.replaceChildren(); }
  const W = el.clientWidth, H = el.clientHeight;
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  el.append(renderer.domElement);
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(getComputedStyle(document.body).backgroundColor);
  sc.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(3, 8, 5); sc.add(sun);
  sc.add(group);
  const cam = new THREE.PerspectiveCamera(50, W / H, 0.01, 1000);
  let dist = 5, r = 5;
  const c = new THREE.Vector3();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.7, 0.8, 0, "YXZ"));
  const q0 = q.clone();
  const place = () => {
    cam.quaternion.copy(q);
    cam.position.copy(c).add(new THREE.Vector3(0, 0, dist).applyQuaternion(q));
  };
  const fit = () => {  // frame the current model and reset the view
    const box = new THREE.Box3().setFromObject(V.group);
    if (box.isEmpty()) return false;
    box.getCenter(c); r = box.getSize(new THREE.Vector3()).length() || 5; dist = r * 1.1;
    q.copy(q0);
    cam.near = r / 1000; cam.far = r * 20; cam.updateProjectionMatrix();
    place();
    return true;
  };
  V = { renderer, scene: sc, cam, group, fit: null };
  if (!fit()) V.fit = fit;  // empty first live frame: frame on the first one that has geometry
  // Controls: drag = rotate (no limits, so it can be flipped); right-drag / shift-drag / two fingers = pan;
  // wheel / pinch = zoom; double-click or double-tap = reset. Tap a red arrow to open its photo.
  const cv = renderer.domElement;
  cv.style.touchAction = "none";
  const ptrs = new Map();
  let downAt = null, lastPinch = 0, lastMid = null, panning = false;
  const pan = (dx, dy) => {
    const k = 2 * dist * Math.tan(cam.fov * Math.PI / 360) / cv.clientHeight;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(q), up = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
    c.addScaledVector(right, -dx * k).addScaledVector(up, dy * k); place();
  };
  const rotate = (dx, dy) => {
    q.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -dx * 0.008));
    q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -dy * 0.008));
    q.normalize(); place();
  };
  cv.onpointerdown = e => {
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    panning = e.button === 2 || e.shiftKey || e.ctrlKey;
    if (ptrs.size === 1) downAt = [e.clientX, e.clientY];
    if (ptrs.size === 2) { downAt = null; const [a, b] = [...ptrs.values()]; lastPinch = Math.hypot(a[0] - b[0], a[1] - b[1]); lastMid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
  };
  cv.onpointermove = e => {
    const prev = ptrs.get(e.pointerId);
    if (!prev) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) {
      (panning ? pan : rotate)(e.clientX - prev[0], e.clientY - prev[1]);
    } else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]), mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      if (lastPinch > 0) { dist = Math.max(r * 0.05, Math.min(r * 8, dist * lastPinch / d)); }
      pan(mid[0] - lastMid[0], mid[1] - lastMid[1]);
      lastPinch = d; lastMid = mid;
    }
  };
  cv.onpointerup = cv.onpointercancel = e => {
    ptrs.delete(e.pointerId);
    if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 4) {  // a tap, not a drag
      const rect = cv.getBoundingClientRect();
      const ray = new THREE.Raycaster();
      ray.setFromCamera(new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1), cam);
      const hit = ray.intersectObjects(V.group.children.filter(o => o.userData.photo))[0];
      if (hit) openPhoto(...hit.object.userData.photo);
    }
    downAt = null; lastPinch = 0;
  };
  cv.oncontextmenu = e => e.preventDefault();
  cv.ondblclick = () => V.fit && V.fit() || fit();
  cv.onwheel = e => { e.preventDefault(); dist = Math.max(r * 0.05, Math.min(r * 8, dist * (1 + Math.sign(e.deltaY) * 0.1))); place(); };
  const loop = () => { renderer.render(sc, cam); raf = requestAnimationFrame(loop); };
  loop();
}

// ---- live updates: new scans appear by themselves; a scan in progress is drawn as it grows
let live = false;

function enterLive() {
  if (live) return;
  live = true; current = null;
  V = null;  // force a fresh scene sized to the page
  $("hint").hidden = true; $("detail").hidden = false;
  $("title").textContent = "● Live scan";
  $("status").textContent = "scanning"; $("status").className = "";
  $("actions").replaceChildren(); $("plan").hidden = true; $("log").textContent = "Receiving from the phone…";
  loadList();
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/events`);
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "live") {
      enterLive();
      draw(m.room, true);
    } else if (m.type === "list") {
      if (m.deleted && m.deleted === current) clearDetail();
      loadList();
    } else if (m.type === "live_end") {
      live = false;
    } else if (m.type === "scan") {
      const wasLive = live || !current;
      live = false;
      await loadList();
      if (wasLive || m.id === current) show(m.id);
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

const params = new URLSearchParams(location.search);
if (params.get("embed")) document.body.classList.add("embed");  // inside the iPhone app: no list, just the viewer
loadList().then(() => { if (params.get("scan")) show(params.get("scan")); });
</script>
</body>
