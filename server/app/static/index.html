<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomScan</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --mute:#6b7380; --line:#d8dce2; --acc:#2563eb; --err:#c62828; --ok:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --fg:#e6e9ee; --mute:#8b94a1; --line:#2a2f37; --acc:#6ea0ff; --err:#ef7b7b; --ok:#6fcf7a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  @media (max-width:700px) { body { grid-template-columns:1fr; } }
  aside { border-right:1px solid var(--line); padding:16px; }
  main { padding:16px; min-width:0; }
  h1 { font-size:18px; margin:0 0 12px; }
  ul { list-style:none; padding:0; margin:0; }
  li button { all:unset; display:block; width:100%; padding:8px; border-radius:6px; cursor:pointer; }
  li button:hover, li button.sel { background:color-mix(in srgb, var(--acc) 14%, transparent); }
  li small { color:var(--mute); display:block; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .btn { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:none; color:var(--fg); text-decoration:none; cursor:pointer; font:inherit; }
  .btn:hover { border-color:var(--acc); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:1000px) { .grid { grid-template-columns:1fr; } }
  #view { width:100%; height:380px; border:1px solid var(--line); border-radius:6px; }
  img { max-width:100%; border:1px solid var(--line); border-radius:6px; background:#fff; }
  pre { background:color-mix(in srgb, var(--fg) 6%, transparent); padding:10px; border-radius:6px; overflow:auto; max-height:240px; font-size:12px; }
  .ok { color:var(--ok); } .error { color:var(--err); }
  .mute { color:var(--mute); }
</style>
</head>
<body>
<aside>
  <h1>RoomScan</h1>
  <ul id="list"></ul>
  <p class="mute" id="empty" hidden>No scans yet. Upload from the app.</p>
</aside>
<main>
  <p class="mute" id="hint">Select a scan.</p>
  <div id="detail" hidden>
    <h1 id="title"></h1>
    <div>Status: <b id="status"></b></div>
    <div class="row" id="actions"></div>
    <div class="grid">
      <div><div id="view"></div></div>
      <div><img id="plan" alt="Plan"></div>
    </div>
    <h3>Log</h3>
    <pre id="log"></pre>
  </div>
</main>
<script type="module">
import * as THREE from "./three.module.min.js";

const $ = id => document.getElementById(id);
let current = null, renderer = null, raf = 0;

async function loadList() {
  const scans = await (await fetch("/api/scans")).json();
  $("empty").hidden = scans.length > 0;
  $("list").replaceChildren(...scans.map(s => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.className = s.id === current ? "sel" : "";
    b.textContent = s.name;
    const small = document.createElement("small");
    small.textContent = new Date(s.created_at * 1000).toLocaleString() + " · " + (s.status || "?");
    b.append(small);
    b.onclick = () => show(s.id);
    li.append(b);
    return li;
  }));
}

async function show(id) {
  current = id;
  const meta = await (await fetch(`/api/scans/${id}`)).json();
  $("hint").hidden = true; $("detail").hidden = false;
  $("title").textContent = meta.name;
  $("status").textContent = meta.status; $("status").className = meta.status;
  $("log").textContent = meta.log || "";
  $("plan").src = meta.status === "ok" ? `/api/scans/${id}/plan.png?t=${Date.now()}` : "";
  const actions = $("actions");
  actions.replaceChildren();
  for (const f of ["room.bimcraft", "room.ifc", "plan.png", "script.txt", "scan.json"]) {
    const a = document.createElement("a");
    a.className = "btn"; a.textContent = f; a.href = `/api/scans/${id}/${f}`; a.download = f;
    actions.append(a);
  }
  const re = document.createElement("button");
  re.className = "btn"; re.textContent = "Re-convert";
  re.onclick = async () => { re.disabled = true; await fetch(`/api/scans/${id}/convert`, { method: "POST" }); await show(id); loadList(); };
  actions.append(re);
  loadList();
  try { draw(await (await fetch(`/api/scans/${id}/scan.json`)).json()); }
  catch (e) { $("log").textContent += "\n3D preview failed: " + e; }
}

function surfaceMesh(s, color, opacity) {
  const [w, h, d] = s.dimensions;
  const t = s.transform.length === 16 ? s.transform : s.transform.flat();
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, Math.max(d, 0.05)),
    new THREE.MeshLambertMaterial({ color, transparent: opacity < 1, opacity }));
  m.applyMatrix4(new THREE.Matrix4().fromArray(t));  // column-major, as RoomPlan encodes it
  return m;
}

function draw(scan) {
  cancelAnimationFrame(raf);
  const el = $("view");
  if (renderer) { renderer.dispose(); el.replaceChildren(); }
  const W = el.clientWidth, H = el.clientHeight;
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  el.append(renderer.domElement);
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(getComputedStyle(document.body).backgroundColor);
  sc.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(3, 8, 5); sc.add(sun);
  const group = new THREE.Group();
  for (const w of scan.walls || []) group.add(surfaceMesh(w, 0xb8bec8, 0.75));
  for (const d of scan.doors || []) group.add(surfaceMesh(d, 0xb5733a, 1));
  for (const w of scan.windows || []) group.add(surfaceMesh(w, 0x4aa3df, 0.7));
  sc.add(group);
  const box = new THREE.Box3().setFromObject(group);
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() || 5;
  const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);
  let yaw = 0.8, pitch = 0.7, dist = r * 1.1;
  const place = () => {
    cam.position.set(c.x + dist * Math.cos(pitch) * Math.sin(yaw), c.y + dist * Math.sin(pitch), c.z + dist * Math.cos(pitch) * Math.cos(yaw));
    cam.lookAt(c);
  };
  place();
  let drag = null;
  const cv = renderer.domElement;
  cv.onpointerdown = e => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); };
  cv.onpointerup = () => drag = null;
  cv.onpointermove = e => {
    if (!drag) return;
    yaw -= (e.clientX - drag[0]) * 0.01;
    pitch = Math.max(0.05, Math.min(1.5, pitch + (e.clientY - drag[1]) * 0.01));
    drag = [e.clientX, e.clientY]; place();
  };
  cv.onwheel = e => { e.preventDefault(); dist = Math.max(1, dist * (1 + Math.sign(e.deltaY) * 0.1)); place(); };
  const loop = () => { renderer.render(sc, cam); raf = requestAnimationFrame(loop); };
  loop();
}

loadList();
</script>
</body>
</html>
