<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared model</title>
<style>
:root{--bg:#f4f6f7;--fg:#1c2328;--card:#fff;--line:#d5dbde;--accent:#0d999e}
@media (prefers-color-scheme:dark){:root{--bg:#14191c;--fg:#e8eef0;--card:#1d2427;--line:#2f3a3f}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:1.05rem;margin:0}small{opacity:.7}a.btn{margin-left:auto;background:var(--accent);color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600}
#view{height:calc(100% - 58px)}canvas{display:block;width:100%;height:100%}
#msg{padding:24px;text-align:center}
</style></head><body>
<header><h1 id="name">Loading…</h1><small id="size"></small><a class="btn" id="stl" href="#">Download STL</a></header>
<div id="view"><div id="msg">Loading the model…</div></div>
<script type="module">
import * as THREE from "/three.module.min.js";
const token = location.pathname.split("/")[2];
const r = await fetch(`/s/${token}/mesh.json`);
const box = document.getElementById("view");
if (!r.ok) { box.firstElementChild.textContent = "This link is not shared any more."; throw 0; }
const m = await r.json();
document.getElementById("name").textContent = m.name || "Shared model";
document.title = m.name || "Shared model";
document.getElementById("size").textContent = m.size_mm.join(" × ") + " mm";
document.getElementById("stl").href = `/s/${token}/model.stl`;
box.replaceChildren();
const rend = new THREE.WebGLRenderer({ antialias: true }); box.append(rend.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(getComputedStyle(document.body).backgroundColor);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(300, -400, 500); scene.add(sun);
const g = new THREE.BufferGeometry();
g.setAttribute("position", new THREE.Float32BufferAttribute(m.vertices, 3));
if (m.colors) g.setAttribute("color", new THREE.Float32BufferAttribute(m.colors, 3));
g.setIndex(m.faces); g.computeVertexNormals();
const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: m.colors ? 0xffffff : 0xc9a46c, vertexColors: !!m.colors, roughness: 0.75, side: THREE.DoubleSide }));
scene.add(mesh);
const bb = new THREE.Box3().setFromObject(mesh), c = bb.getCenter(new THREE.Vector3()), R = bb.getSize(new THREE.Vector3()).length();
const cam = new THREE.PerspectiveCamera(45, 1, R / 100, R * 20); cam.up.set(0, 0, 1);
let az = -0.8, el = 0.45, dist = R * 1.3, drag = null;
const draw = () => {
  const w = box.clientWidth, h = box.clientHeight; rend.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
  cam.position.set(c.x + dist * Math.cos(el) * Math.sin(az), c.y - dist * Math.cos(el) * Math.cos(az), c.z + dist * Math.sin(el)); cam.lookAt(c); rend.render(scene, cam);
};
const e = rend.domElement; e.style.touchAction = "none";
const pts = new Map(); let pinch = 0;
e.onpointerdown = ev => { pts.set(ev.pointerId, [ev.clientX, ev.clientY]); e.setPointerCapture(ev.pointerId); };
e.onpointermove = ev => {
  const p = pts.get(ev.pointerId); if (!p) return;
  if (pts.size === 2) { pts.set(ev.pointerId, [ev.clientX, ev.clientY]); const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) dist = Math.max(R * .3, Math.min(R * 4, dist * pinch / d)); pinch = d; draw(); return; }
  az -= (ev.clientX - p[0]) * 0.01; el = Math.max(-1.5, Math.min(1.5, el + (ev.clientY - p[1]) * 0.01)); pts.set(ev.pointerId, [ev.clientX, ev.clientY]); draw();
};
e.onpointerup = e.onpointercancel = ev => { pts.delete(ev.pointerId); pinch = 0; };
e.onwheel = ev => { ev.preventDefault(); dist = Math.max(R * .3, Math.min(R * 4, dist * (1 + Math.sign(ev.deltaY) * 0.1))); draw(); };
addEventListener("resize", draw); draw();
</script></body></html>
