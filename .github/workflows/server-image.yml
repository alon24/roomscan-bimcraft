name: Server image

# Builds the server (with bimcraft-cli) for Intel/AMD and Apple Silicon/ARM on native runners, and publishes one multi-arch image:
#   ghcr.io/alon24/roomscan-bimcraft-server:latest
# Another computer then runs it with docker-compose.prebuilt.yml, with no Rust compile.
on:
  push:
    paths: ["server/**", "VERSION", ".github/workflows/server-image.yml"]
  workflow_dispatch:

concurrency:
  group: server-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alon24/roomscan-bimcraft-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit count (build number) is right
      - id: ver
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_BUILD=${{ steps.ver.outputs.build }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: docker buildx imagetools create -t ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:latest-amd64 ${{ env.IMAGE }}:latest-arm64
