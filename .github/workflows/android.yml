name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml", "VERSION"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit count (build number) is right
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK (signed with the debug key, installs by sideloading)
        run: |
          cd android
          gradle assembleDebug -PappVersion=$(cat ../VERSION) -PappBuild=$(git rev-list --count HEAD)
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RoomScan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RoomScan.apk
          path: RoomScan.apk
