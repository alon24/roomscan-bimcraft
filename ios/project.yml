name: RoomScan
options:
  bundleIdPrefix: com.roomscan
  deploymentTarget:
    iOS: "17.0"
targets:
  RoomScan:
    type: application
    platform: iOS
    sources: [RoomScan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomscan.app
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        INFOPLIST_FILE: RoomScan/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
